<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단지별 독립 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        .unit-card { transition: all 0.2s; border-width: 2px; }
        .highlight { 
            background-color: #fef08a !important; 
            border-color: #f59e0b !important; 
            transform: scale(1.05); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 id="complexTitle" class="text-3xl font-extrabold text-slate-800 tracking-tight">단지 정보 불러오는 중...</h1>
            <p class="text-slate-500 mt-2 text-sm font-medium">실시간 데이터 동기화 관리 시스템</p>
        </header>

        <div class="bg-white p-5 rounded-2xl shadow-lg mb-8 sticky top-4 z-40 border border-slate-200">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="searchInput" placeholder="주민 이름, 호수, 메모로 실시간 검색..." 
                       class="flex-1 border-2 border-slate-100 p-3 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all">
                
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="addSingleUnit()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition">
                        + 호수 추가
                    </button>
                    <button onclick="addDongPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition">
                        + 동 범위 추가
                    </button>
                    <label class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-bold cursor-pointer shadow-md transition">
                        📁 엑셀 업로드
                        <input type="file" id="excelInput" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleExcel(event)">
                    </label>
                    <button onclick="deleteDongPrompt()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md transition">
                        동 삭제
                    </button>
                </div>
            </div>
        </div>

        <div id="apartmentContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-slate-900/60 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl transition-all scale-100">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 id="modalTitle" class="text-2xl font-black text-slate-800">정보 수정</h2>
                    <p id="modalSubTitle" class="text-sm text-slate-400 font-medium"></p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-2 tracking-widest">입주자 (소유주)</label>
                    <input type="text" id="ownerInput" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none focus:border-blue-400 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase mb-2 tracking-widest">세입자 및 구성원</label>
                    <textarea id="tenantInput" rows="3" class="w-full border-2 border-slate-100 p-3 rounded-xl outline-none focus:border-orange-400 transition"></textarea>
                </div>
                
                <div class="pt-4 border-t border-slate-100 space-y-3">
                    <div class="flex gap-2">
                        <button id="saveBtn" onclick="saveData()" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition">저장하기</button>
                        <button onclick="closeModal()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition">취소</button>
                    </div>
                    <button onclick="deleteSingleUnit()" class="w-full py-2 text-rose-500 text-sm font-bold hover:bg-rose-50 border border-rose-100 rounded-lg transition">이 호수만 삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id",
            storageBucket: "apt-member-id.firebasestorage.app",
            messagingSenderId: "562369347279",
            appId: "1:562369347279:web:fe0e203bef243bbdc801ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const COMPLEX_ID = urlParams.get('id') || '기본단지';
        document.getElementById('complexTitle').innerText = `🏢 ${COMPLEX_ID} 관리 명부`;

        let currentTarget = { dong: '', ho: '' };

        onSnapshot(doc(db, "complexes", COMPLEX_ID), (snapshot) => {
            const data = snapshot.data() || {};
            renderUI(data);
        });

        function renderUI(data) {
            const container = document.getElementById('apartmentContainer');
            container.innerHTML = '';
            const sortedDongs = Object.keys(data).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
            
            if(sortedDongs.length === 0) {
                container.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400 font-bold">등록된 데이터가 없습니다.</div>';
                return;
            }

            sortedDongs.forEach(dong => {
                const dongDiv = document.createElement('div');
                dongDiv.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden';
                const sortedHos = Object.keys(data[dong]).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
                
                let hoHtml = '';
                sortedHos.forEach(ho => {
                    const info = data[dong][ho];
                    const hasTenant = info.tenant && info.tenant.trim() !== "";
                    hoHtml += `
                        <div onclick="openModal('${dong}', '${ho}', '${info.owner || ''}', '${info.tenant || ''}')" 
                             class="unit-card p-3 border rounded-xl cursor-pointer hover:border-blue-400 transition-all ${hasTenant ? 'bg-orange-50/50 border-orange-100' : 'bg-blue-50/30 border-blue-100'}">
                            <div class="font-black text-slate-700 text-sm">${ho}호</div>
                            <div class="text-[10px] truncate text-blue-600 font-bold">주: ${info.owner || '-'}</div>
                            <div class="text-[10px] truncate text-orange-600 font-bold">세: ${info.tenant || '-'}</div>
                        </div>
                    `;
                });

                dongDiv.innerHTML = `<div class="bg-slate-800 text-white px-4 py-2 font-bold flex justify-between uppercase text-xs tracking-widest"><span>${dong}동</span><span>${sortedHos.length} units</span></div><div class="p-4 grid grid-cols-2 gap-3">${hoHtml}</div>`;
                container.appendChild(dongDiv);
            });
        }

        /* ------------------ 기능 제어 ------------------ */

        window.addSingleUnit = async () => {
            const dong = prompt("동 번호 (예: 101):"); if (!dong) return;
            const ho = prompt(`${dong}동에 추가할 호수:`); if (!ho) return;
            try {
                await setDoc(doc(db, "complexes", COMPLEX_ID), { [dong]: { [ho]: { owner: "", tenant: "" } } }, { merge: true });
            } catch (e) { alert("저장 실패: Firebase 규칙을 확인하세요."); }
        };

        window.addDongPrompt = async () => {
            const dong = prompt("생성할 동 번호 (예: 101):"); if (!dong) return;
            const last = prompt("마지막 호수 (예: 15):", "10"); if (!last || isNaN(last)) return;
            
            const obj = {};
            for(let i=1; i<=parseInt(last); i++) {
                obj[i.toString()] = { owner: "", tenant: "" };
            }
            
            try {
                // 특정 동 전체를 생성/업데이트
                await setDoc(doc(db, "complexes", COMPLEX_ID), { [dong]: obj }, { merge: true });
            } catch (e) { alert("동 추가 실패: 규칙 설정 혹은 네트워크를 확인하세요."); }
        };

        window.handleExcel = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                try {
                    const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                    const updateObj = {};
                    rows.slice(1).forEach(r => {
                        if (r[0] && r[1]) {
                            if (!updateObj[r[0]]) updateObj[r[0]] = {};
                            updateObj[r[0]][r[1]] = { owner: String(r[2]||""), tenant: String(r[3]||"") };
                        }
                    });
                    await setDoc(doc(db, "complexes", COMPLEX_ID), updateObj, { merge: true });
                    alert("업로드 완료");
                } catch (err) { alert("엑셀 처리 중 오류 발생"); }
            };
            reader.readAsBinaryString(file);
        };

        window.deleteDongPrompt = async () => {
            const dong = prompt("삭제할 동 번호:");
            if (dong && confirm(`${dong}동 전체 데이터를 삭제하시겠습니까?`)) {
                await updateDoc(doc(db, "complexes", COMPLEX_ID), { [dong]: deleteField() });
            }
        };

        window.deleteSingleUnit = async () => {
            const { dong, ho } = currentTarget;
            if (confirm(`${dong}동 ${ho}호를 삭제하시겠습니까?`)) {
                await updateDoc(doc(db, "complexes", COMPLEX_ID), { [`${dong}.${ho}`]: deleteField() });
                closeModal();
            }
        };

        window.openModal = (dong, ho, owner, tenant) => {
            currentTarget = { dong, ho };
            document.getElementById('modalTitle').innerText = `${ho}호 상세수정`;
            document.getElementById('modalSubTitle').innerText = `${dong}동`;
            document.getElementById('ownerInput').value = owner;
            document.getElementById('tenantInput').value = tenant;
            document.getElementById('editModal').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('editModal').classList.add('hidden');

        window.saveData = async () => {
            const owner = document.getElementById('ownerInput').value;
            const tenant = document.getElementById('tenantInput').value;
            await setDoc(doc(db, "complexes", COMPLEX_ID), { 
                [currentTarget.dong]: { [currentTarget.ho]: { owner, tenant } } 
            }, { merge: true });
            closeModal();
        };

        document.getElementById('searchInput').addEventListener('input', function() {
            const kw = this.value.trim().toLowerCase();
            document.querySelectorAll('.unit-card').forEach(card => {
                card.classList.toggle('highlight', kw !== '' && card.innerText.toLowerCase().includes(kw));
            });
        });
    </script>
</body>
</html>
