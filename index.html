<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단지 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        .unit-card { transition: all 0.2s; border-width: 2px; }
        .highlight { 
            background-color: #fef08a !important; 
            border-color: #f59e0b !important; 
            transform: scale(1.05); 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
    </style>
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 id="complexTitle" class="text-3xl font-extrabold text-slate-800 tracking-tight">단지 로딩 중...</h1>
        </header>

        <div class="bg-white p-5 rounded-2xl shadow-lg mb-8 sticky top-4 z-40 border border-slate-200">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="searchInput" placeholder="이름, 호수, 연락처 검색..." 
                       class="flex-1 border-2 border-slate-100 p-3 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all">
                
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="addSingleUnit()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition">호 추가</button>
                    <button onclick="addDongPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition">동 추가</button>
                    <label class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-lg text-sm font-bold cursor-pointer shadow-md transition">
                        엑셀 업로드
                        <input type="file" id="excelInput" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleExcel(event)">
                    </label>
                    <button onclick="deleteDongPrompt()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-lg text-sm font-bold shadow-md transition">동 삭제</button>
                </div>
            </div>
        </div>

        <div id="apartmentContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-slate-900/60 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl transition-all scale-100">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modalTitle" class="text-2xl font-black text-slate-800">정보 수정</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">호수 이름</label>
                    <input type="text" id="hoNameInput" class="w-full border-2 border-slate-100 p-2.5 rounded-xl outline-none focus:border-emerald-400 transition font-bold text-emerald-600">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">입주자 (소유주)</label>
                    <input type="text" id="ownerInput" class="w-full border-2 border-slate-100 p-2.5 rounded-xl outline-none focus:border-blue-400 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">연락처</label>
                    <input type="text" id="phoneInput" placeholder="010-0000-0000" class="w-full border-2 border-slate-100 p-2.5 rounded-xl outline-none focus:border-purple-400 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">세입자 및 비고</label>
                    <textarea id="tenantInput" rows="2" class="w-full border-2 border-slate-100 p-2.5 rounded-xl outline-none focus:border-orange-400 transition"></textarea>
                </div>
                <div class="pt-4 border-t border-slate-100 space-y-3">
                    <div class="flex gap-2">
                        <button onclick="saveData()" class="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg transition">저장하기</button>
                        <button onclick="closeModal()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold transition">취소</button>
                    </div>
                    <button onclick="deleteSingleUnit()" class="w-full py-2 text-rose-500 text-sm font-bold hover:bg-rose-50 border border-rose-100 rounded-lg transition">호 삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id",
            storageBucket: "apt-member-id.firebasestorage.app",
            messagingSenderId: "562369347279",
            appId: "1:562369347279:web:fe0e203bef243bbdc801ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const COMPLEX_ID = urlParams.get('id') || '기본단지';
        document.getElementById('complexTitle').innerText = `🏢 ${COMPLEX_ID} 관리 명부`;

        let currentTarget = { dong: '', ho: '' };

        onSnapshot(doc(db, "complexes", COMPLEX_ID), (snapshot) => {
            renderUI(snapshot.data() || {});
        });

        function renderUI(data) {
            const container = document.getElementById('apartmentContainer');
            container.innerHTML = '';
            const sortedDongs = Object.keys(data).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
            
            if(sortedDongs.length === 0) {
                container.innerHTML = '<div class="col-span-full py-20 text-center text-slate-400 font-bold">데이터가 없습니다.</div>';
                return;
            }

            sortedDongs.forEach(dong => {
                const dongDiv = document.createElement('div');
                dongDiv.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden';
                const sortedHos = Object.keys(data[dong]).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
                
                let hoHtml = '';
                sortedHos.forEach(ho => {
                    const info = data[dong][ho];
                    hoHtml += `
                        <div onclick="openModal('${dong}', '${ho}', '${info.owner || ''}', '${info.tenant || ''}', '${info.phone || ''}')" 
                             class="unit-card p-3 border rounded-xl cursor-pointer hover:border-blue-400 transition-all ${(info.tenant || info.owner) ? 'bg-white' : 'bg-slate-50 opacity-60'}">
                            <div class="font-black text-slate-700 text-sm mb-1">${ho}호</div>
                            <div class="text-[10px] truncate text-blue-600 font-bold">주: ${info.owner || '-'}</div>
                            <div class="text-[10px] truncate text-purple-600 font-bold">📞 ${info.phone || '-'}</div>
                            <div class="text-[10px] truncate text-slate-500">세: ${info.tenant || '-'}</div>
                        </div>
                    `;
                });

                dongDiv.innerHTML = `<div class="bg-slate-800 text-white px-4 py-2 font-bold flex justify-between uppercase text-xs tracking-widest"><span>${dong}동</span><span>${sortedHos.length} 세대</span></div><div class="p-4 grid grid-cols-2 gap-3">${hoHtml}</div>`;
                container.appendChild(dongDiv);
            });
        }

        window.addDongPrompt = async () => {
            const dong = prompt("동 번호:"); if (!dong) return;
            const prefix = prompt("호수 규칙 (예: 10 입력 시 101, 102...):", "10");
            const count = prompt("세대 수:", "10");
            if (!count || isNaN(count)) return;
            const obj = {};
            for(let i=1; i<=parseInt(count); i++) obj[`${prefix}${i}`] = { owner: "", tenant: "", phone: "" };
            await setDoc(doc(db, "complexes", COMPLEX_ID), { [dong]: obj }, { merge: true });
        };

        window.addSingleUnit = async () => {
            const dong = prompt("동 번호:"); if (!dong) return;
            const ho = prompt("호수 이름:"); if (!ho) return;
            await setDoc(doc(db, "complexes", COMPLEX_ID), { [dong]: { [ho]: { owner: "", tenant: "", phone: "" } } }, { merge: true });
        };

        window.handleExcel = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const workbook = XLSX.read(evt.target.result, { type: 'binary' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                const updateObj = {};
                rows.slice(1).forEach(r => {
                    if (r[0] && r[1]) {
                        if (!updateObj[r[0]]) updateObj[r[0]] = {};
                        updateObj[r[0]][r[1]] = { owner: String(r[2]||""), phone: String(r[3]||""), tenant: String(r[4]||"") };
                    }
                });
                await setDoc(doc(db, "complexes", COMPLEX_ID), updateObj, { merge: true });
                alert("업로드 완료 (A:동, B:호, C:주인, D:연락처, E:세입자)");
            };
            reader.readAsBinaryString(file);
        };

        window.deleteDongPrompt = async () => {
            const dong = prompt("삭제할 동 번호:");
            if (dong && confirm(`${dong}동 전체를 삭제할까요?`)) {
                await updateDoc(doc(db, "complexes", COMPLEX_ID), { [dong]: deleteField() });
            }
        };

        window.deleteSingleUnit = async () => {
            if (confirm(`${currentTarget.ho}호를 삭제하시겠습니까?`)) {
                await updateDoc(doc(db, "complexes", COMPLEX_ID), { [`${currentTarget.dong}.${currentTarget.ho}`]: deleteField() });
                closeModal();
            }
        };

        window.openModal = (dong, ho, owner, tenant, phone) => {
            currentTarget = { dong, ho };
            document.getElementById('hoNameInput').value = ho;
            document.getElementById('ownerInput').value = owner;
            document.getElementById('tenantInput').value = tenant;
            document.getElementById('phoneInput').value = phone || '';
            document.getElementById('editModal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('editModal').classList.add('hidden');

        window.saveData = async () => {
            const newHo = document.getElementById('hoNameInput').value.trim();
            const owner = document.getElementById('ownerInput').value;
            const tenant = document.getElementById('tenantInput').value;
            const phone = document.getElementById('phoneInput').value;

            const newData = { owner, tenant, phone };

            if (newHo !== currentTarget.ho) {
                await setDoc(doc(db, "complexes", COMPLEX_ID), { [currentTarget.dong]: { [newHo]: newData } }, { merge: true });
                await updateDoc(doc(db, "complexes", COMPLEX_ID), { [`${currentTarget.dong}.${currentTarget.ho}`]: deleteField() });
            } else {
                await setDoc(doc(db, "complexes", COMPLEX_ID), { [currentTarget.dong]: { [currentTarget.ho]: newData } }, { merge: true });
            }
            closeModal();
        };

        document.getElementById('searchInput').addEventListener('input', function() {
            const kw = this.value.trim().toLowerCase();
            document.querySelectorAll('.unit-card').forEach(card => {
                card.classList.toggle('highlight', kw !== '' && card.innerText.toLowerCase().includes(kw));
            });
        });
    </script>
</body>
</html>
