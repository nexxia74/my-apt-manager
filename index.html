<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>단지 관리 프로그램</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        .unit { transition: transform 0.1s; cursor: pointer; }
        .unit:active { transform: scale(0.97); }
        .empty { opacity: 0.4; }
        #hoLayer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f8fafc; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40; overflow-y: auto;
        }
        #hoLayer.show { transform: translateY(-100%); }
        .sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: white; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            transition: 0.3s ease-out; z-index: 60;
        }
        .sheet.show { bottom: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 50; }
        .overlay.show { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="p-4 bg-white shadow-sm sticky top-0 z-20">
        <div class="flex justify-between items-center mb-4">
            <h1 id="mainTitle" class="text-xl font-extrabold text-blue-600 font-mono">단지 연결 중...</h1>
            <button onclick="location.reload()" class="text-[10px] bg-slate-100 px-2 py-1 rounded font-bold text-slate-500">새로고침</button>
        </div>
        <input id="search" placeholder="이름 / 연락처 / 호수 검색" class="w-full border-slate-200 border p-3 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button id="addDongBtn" class="bg-blue-600 text-white py-2 rounded-lg text-[11px] font-bold">동 추가</button>
            <button id="addHoBtn" class="bg-emerald-600 text-white py-2 rounded-lg text-[11px] font-bold">호 추가</button>
            <button id="deleteDongBtn" class="bg-rose-500 text-white py-2 rounded-lg text-[11px] font-bold">동 삭제</button>
            <label class="bg-amber-500 text-white py-2 rounded-lg text-center cursor-pointer text-[11px] font-bold flex items-center justify-center">
                엑셀<input type="file" id="excelInput" class="hidden">
            </label>
        </div>
    </div>

    <div class="p-4">
        <h3 class="text-xs font-bold text-slate-400 mb-4 tracking-wider uppercase">Building List</h3>
        <div id="dongList" class="grid grid-cols-4 gap-3"></div>
    </div>

    <div id="hoLayer">
        <div class="p-4 bg-white border-b sticky top-0 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="p-2 text-slate-400 text-2xl">←</button>
                <h2 id="currentDongTitle" class="font-bold text-lg"></h2>
            </div>
        </div>
        <div id="grid" class="p-4 grid grid-cols-2 gap-3 pb-24"></div>
    </div>

    <div id="overlay" class="overlay" onclick="history.back()"></div>
    <div id="sheet" class="sheet p-6">
        <div id="detailTitle" class="font-bold text-xl mb-6 text-slate-800"></div>
        <div class="space-y-6">
            <div class="bg-blue-50/50 p-4 rounded-xl">
                <label class="text-xs font-bold text-blue-600 block mb-1">소유주 정보</label>
                <input id="ownerInput" placeholder="이름" class="w-full bg-transparent border-b border-blue-200 py-1 font-bold text-lg focus:outline-none">
                <input id="ownerPhoneInput" placeholder="연락처" class="w-full bg-transparent py-1 text-sm focus:outline-none mt-1">
            </div>
            <div class="bg-emerald-50/50 p-4 rounded-xl">
                <label class="text-xs font-bold text-emerald-600 block mb-1">세입자 정보</label>
                <input id="tenantInput" placeholder="이름" class="w-full bg-transparent border-b border-emerald-200 py-1 font-bold text-lg focus:outline-none">
                <input id="tenantPhoneInput" placeholder="연락처" class="w-full bg-transparent py-1 text-sm focus:outline-none mt-1">
            </div>
            <div class="flex gap-3">
                <button id="delBtn" class="flex-1 text-rose-500 font-bold">삭제</button>
                <button onclick="history.back()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold">확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // [핵심 로직] 주소창의 경로에서 단지명을 정확하게 추출
        function getComplexName() {
            let path = decodeURIComponent(window.location.pathname);
            // index.html 등 파일명 제거
            path = path.split('/').filter(p => p && !p.includes('.html'))[0];
            return path || "기본단지";
        }

        const COMPLEX_NAME = getComplexName();
        const COL = `complexes/${COMPLEX_NAME}/hos`;
        document.getElementById('mainTitle').innerText = COMPLEX_NAME;

        let data = [], selected = null, timer, currentDong = null;

        async function load() {
            const snap = await getDocs(collection(db, COL));
            data = snap.docs.map(d => d.data());
            renderDong();
            if (currentDong) renderHo(currentDong);
        }

        function renderDong() {
            const dongs = [...new Set(data.map(v => v.dong))].sort((a,b) => parseInt(a)-parseInt(b));
            document.getElementById('dongList').innerHTML = dongs.map(d => `
                <button onclick="openHoLayer('${d}')" class="bg-white border rounded-2xl py-5 shadow-sm active:bg-blue-50">
                    <span class="font-black text-lg text-slate-700">${d.replace('동','')}</span>
                    <span class="text-xs text-slate-400 font-bold">동</span>
                </button>
            `).join('');
        }

        window.openHoLayer = (dong) => {
            currentDong = dong;
            document.getElementById('hoLayer').classList.add('show');
            document.getElementById('currentDongTitle').innerText = dong;
            renderHo(dong);
            history.pushState({layer: 'ho'}, '');
        };

        window.openDetail = (id) => {
            selected = data.find(v => v.id === id);
            document.getElementById('sheet').classList.add('show');
            document.getElementById('overlay').classList.add('show');
            document.getElementById('detailTitle').innerText = `${selected.dong} ${selected.ho}호`;
            document.getElementById('ownerInput').value = selected.owner || '';
            document.getElementById('ownerPhoneInput').value = selected.ownerPhone || '';
            document.getElementById('tenantInput').value = selected.tenant || '';
            document.getElementById('tenantPhoneInput').value = selected.tenantPhone || '';
            history.pushState({layer: 'detail'}, '');
        };

        window.onpopstate = (e) => {
            document.getElementById('hoLayer').classList.toggle('show', e.state?.layer === 'ho' || e.state?.layer === 'detail');
            document.getElementById('sheet').classList.toggle('show', e.state?.layer === 'detail');
            document.getElementById('overlay').classList.toggle('show', e.state?.layer === 'detail');
        };

        function renderHo(dong) {
            const filtered = data.filter(v => v.dong === dong).sort((a,b) => parseInt(a.ho) - parseInt(b.ho));
            document.getElementById('grid').innerHTML = filtered.map(v => `
                <div onclick="openDetail('${v.id}')" class="unit p-4 rounded-2xl bg-white border ${(!v.owner && !v.tenant) ? 'empty' : ''}">
                    <div class="font-bold text-slate-800 text-sm">${v.ho}호</div>
                    <div class="text-xs text-blue-600 font-bold mt-1 truncate">${v.owner || '공실'}</div>
                    <div class="text-[10px] text-slate-400 truncate">${v.tenant || ''}</div>
                </div>
            `).join('');
        }

        function autoSave() {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                if (!selected) return;
                const update = { ...selected, owner: ownerInput.value, ownerPhone: ownerPhoneInput.value, tenant: tenantInput.value, tenantPhone: tenantPhoneInput.value };
                await setDoc(doc(db, COL, selected.id), update);
                Object.assign(selected, update);
                renderHo(currentDong);
            }, 500);
        }

        [ownerInput, ownerPhoneInput, tenantInput, tenantPhoneInput].forEach(el => el.oninput = autoSave);

        addDongBtn.onclick = async () => {
            let d = prompt("동 번호"); if(!d) return;
            if(!d.endsWith("동")) d += "동";
            const f = prompt("층 범위 (예: 1~15)"); const p = prompt("세대수"); if(!f || !p) return;
            let [s, e] = f.includes("~") ? f.split("~").map(Number) : [1, Number(f)];
            for(let i=s; i<=e; i++) {
                for(let h=1; h<=Number(p); h++) {
                    const ho = `${i}${String(h).padStart(2, '0')}`;
                    await setDoc(doc(db, COL, `${d}_${ho}`), { id: `${d}_${ho}`, dong: d, ho, owner: "", ownerPhone: "", tenant: "", tenantPhone: "" });
                }
            }
            load();
        };

        deleteDongBtn.onclick = async () => {
            let d = prompt("삭제할 동"); if(!d) return;
            if(!d.endsWith("동")) d += "동";
            if(confirm(d + "의 모든 데이터를 삭제할까요?")) {
                data.filter(v => v.dong === d).forEach(async v => await deleteDoc(doc(db, COL, v.id)));
                setTimeout(load, 1000);
            }
        };

        delBtn.onclick = async () => {
            if(confirm("삭제할까요?")) {
                await deleteDoc(doc(db, COL, selected.id));
                history.back(); load();
            }
        };

        load();
    </script>
</body>
</html>
