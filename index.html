<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>입주민 명단</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script>
        (function() {
            const path = window.location.pathname;
            const decodedPath = decodeURIComponent(path);
            const complexName = decodedPath.replace(/^\/+|\/+$/g, "").replace(/index\.html$/, "") || "입주민관리";
            const myManifest = {
                "name": complexName, "short_name": complexName, "start_url": path, "display": "standalone",
                "background_color": "#778899", "theme_color": "#778899",
                "icons": [
                    { "src": "/icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
                    { "src": "/icon.png", "sizes": "512x512", "type": "image/png", "purpose": "any" }
                ]
            };
            const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = URL.createObjectURL(blob);
            document.head.appendChild(link);
        })();
    </script>

    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: sans-serif; background-color: #f8fafc; }
        .unit { transition: transform 0.1s; cursor: pointer; }
        .unit:active { transform: scale(0.97); }
        .empty { opacity: 0.6; }
        #hoLayer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f8fafc; transition: transform 0.3s ease-in-out; z-index: 40; overflow-y: auto;
        }
        #hoLayer.show { transform: translateY(-100%); }
        .sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%; background: white; 
            border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            transition: 0.3s ease-out; z-index: 60; padding: 24px;
        }
        .sheet.show { bottom: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 50; }
        .overlay.show { display: block; }
    </style>
</head>
<body>

    <div class="p-4 bg-white shadow-sm sticky top-0 z-20">
        <input id="search" placeholder="이름 / 연락처 / 호수 검색" class="w-full border-slate-200 border p-3 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-4">
        
        <div class="grid grid-cols-4 gap-2">
            <button id="addDongBtn" class="bg-[#2563eb] text-white py-3 rounded-lg text-[12px] font-bold">동 추가</button>
            <button id="addHoBtn" class="bg-[#059669] text-white py-3 rounded-lg text-[12px] font-bold">호 추가</button>
            <label class="bg-[#f59e0b] text-white py-3 rounded-lg text-center cursor-pointer text-[12px] font-bold flex items-center justify-center">
                엑셀 업로드<input type="file" id="excelInput" class="hidden" accept=".xlsx, .xls">
            </label>
            <button id="deleteDongBtn" class="bg-[#f43f5e] text-white py-3 rounded-lg text-[12px] font-bold">동 삭제</button>
        </div>
    </div>

    <div class="p-4">
        <h3 class="text-xs font-bold text-slate-400 mb-4 tracking-wider uppercase">전체 동 목록</h3>
        <div id="dongList" class="grid grid-cols-4 gap-3"></div>
    </div>

    <div id="hoLayer">
        <div class="p-4 bg-white border-b sticky top-0 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="p-2 text-slate-400 text-2xl">←</button>
                <h2 id="currentDongTitle" class="font-black text-xl text-slate-800"></h2>
            </div>
            <button onclick="history.back()" class="text-blue-600 font-bold">닫기</button>
        </div>
        <div id="grid" class="p-4 grid grid-cols-2 gap-3 pb-24"></div>
    </div>

    <div id="overlay" class="overlay" onclick="history.back()"></div>
    <div id="sheet" class="sheet">
        <div class="flex justify-between items-start mb-4">
            <div class="w-12 h-1 bg-slate-200 rounded-full mt-2"></div>
            <button onclick="history.back()" class="p-1 -mr-2 text-slate-400 text-3xl font-light">&times;</button>
        </div>
        
        <h2 id="detailTitle" class="font-black text-2xl mb-6 text-slate-800"></h2>
        
        <div class="space-y-4">
            <div class="p-5 rounded-2xl bg-blue-50 border border-blue-100">
                <p class="text-sm font-black text-blue-700 mb-1">소유주</p>
                <input id="ownerInput" placeholder="이름 입력" class="w-full bg-transparent border-b border-blue-200 py-2 font-black text-xl focus:outline-none text-blue-900">
                <input id="ownerPhoneInput" placeholder="연락처 입력" class="w-full bg-transparent py-2 text-sm focus:outline-none mt-1 text-blue-600">
            </div>
            <div class="p-5 rounded-2xl bg-emerald-50 border border-emerald-100">
                <p class="text-sm font-black text-emerald-700 mb-1">세입자</p>
                <input id="tenantInput" placeholder="이름 입력" class="w-full bg-transparent border-b border-emerald-200 py-2 font-black text-xl focus:outline-none text-emerald-900">
                <input id="tenantPhoneInput" placeholder="연락처 입력" class="w-full bg-transparent py-2 text-sm focus:outline-none mt-1 text-emerald-600">
            </div>
            <div class="flex gap-3 pt-4">
                <button id="delBtn" class="flex-1 py-4 text-rose-600 font-bold">삭제</button>
                <button id="saveOnlyBtn" class="flex-[2] bg-slate-900 text-white py-4 rounded-2xl font-bold active:bg-slate-700">저장</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const path = decodeURIComponent(window.location.pathname);
        const COMPLEX_NAME = path.replace(/^\/+|\/+$/g, "").replace(/index\.html$/, "") || "기본단지";
        const COL = `complexes/${COMPLEX_NAME}/hos`;

        let data = [], selected = null, timer, currentDong = null;

        async function load() {
            const snap = await getDocs(collection(db, COL));
            data = snap.docs.map(d => d.data());
            renderDong();
            if (currentDong) renderHo(currentDong);
        }

        function renderDong() {
            const dongs = [...new Set(data.map(v => v.dong))].sort((a,b) => parseInt(a)-parseInt(b));
            document.getElementById('dongList').innerHTML = dongs.map(d => `
                <button onclick="openHoLayer('${d}')" class="bg-white border rounded-2xl py-6 shadow-sm active:bg-blue-50 text-center">
                    <span class="font-black text-xl text-slate-800">${d.replace('동','')}동</span>
                </button>
            `).join('');
        }

        window.openHoLayer = (dong) => {
            currentDong = dong;
            document.getElementById('hoLayer').classList.add('show');
            document.getElementById('currentDongTitle').innerText = dong;
            renderHo(dong);
            history.pushState({layer: 'ho'}, '');
        };

        window.openDetail = (id) => {
            selected = data.find(v => v.id === id);
            document.getElementById('sheet').classList.add('show');
            document.getElementById('overlay').classList.add('show');
            document.getElementById('detailTitle').innerText = `${selected.dong} ${selected.ho}호`;
            document.getElementById('ownerInput').value = selected.owner || '';
            document.getElementById('ownerPhoneInput').value = selected.ownerPhone || '';
            document.getElementById('tenantInput').value = selected.tenant || '';
            document.getElementById('tenantPhoneInput').value = selected.tenantPhone || '';
            history.pushState({layer: 'detail'}, '');
        };

        window.onpopstate = (e) => {
            document.getElementById('hoLayer').classList.toggle('show', e.state?.layer === 'ho' || e.state?.layer === 'detail');
            document.getElementById('sheet').classList.toggle('show', e.state?.layer === 'detail');
            document.getElementById('overlay').classList.toggle('show', e.state?.layer === 'detail');
        };

        function renderHo(dong) {
            const filtered = data.filter(v => v.dong === dong).sort((a,b) => parseInt(a.ho) - parseInt(b.ho));
            document.getElementById('grid').innerHTML = filtered.map(v => `
                <div onclick="openDetail('${v.id}')" class="unit p-5 rounded-2xl bg-white border shadow-sm ${(!v.owner && !v.tenant) ? 'empty' : ''}">
                    <div class="font-black text-2xl text-slate-900 mb-1">${v.ho}호</div>
                    <div class="text-sm font-bold text-blue-600 truncate">${v.owner || '공실'}</div>
                    <div class="text-[11px] text-slate-400 truncate">${v.tenant || ''}</div>
                </div>
            `).join('');
        }

        // 수동 저장 버튼 로직 (창 안 닫힘)
        document.getElementById('saveOnlyBtn').onclick = async () => {
            if (!selected) return;
            const update = { ...selected, owner: ownerInput.value, ownerPhone: ownerPhoneInput.value, tenant: tenantInput.value, tenantPhone: tenantPhoneInput.value };
            await setDoc(doc(db, COL, selected.id), update);
            Object.assign(selected, update);
            renderHo(currentDong);
            alert("저장되었습니다.");
        };

        // 자동 저장 로직 유지
        function autoSave() {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                if (!selected) return;
                const update = { ...selected, owner: ownerInput.value, ownerPhone: ownerPhoneInput.value, tenant: tenantInput.value, tenantPhone: tenantPhoneInput.value };
                await setDoc(doc(db, COL, selected.id), update);
                Object.assign(selected, update);
                renderHo(currentDong);
            }, 500);
        }
        [ownerInput, ownerPhoneInput, tenantInput, tenantPhoneInput].forEach(el => el.oninput = autoSave);

        // 기타 기능 (동/호수 추가/삭제/엑셀)
        document.getElementById('addDongBtn').onclick = async () => {
            let d = prompt("동 번호 (예: 101)"); if(!d) return;
            if(!d.endsWith("동")) d += "동";
            const f = prompt("층 범위 (예: 1~15)"); const p = prompt("한 층 세대수 (예: 4)"); if(!f || !p) return;
            let [s, e] = f.includes("~") ? f.split("~").map(Number) : [1, Number(f)];
            const batch = writeBatch(db);
            for(let i=s; i<=e; i++) {
                for(let h=1; h<=Number(p); h++) {
                    const ho = `${i}${String(h).padStart(2, '0')}`;
                    const docId = `${d}_${ho}`;
                    batch.set(doc(db, COL, docId), {id:docId, dong:d, ho, owner:"", ownerPhone:"", tenant:"", tenantPhone:""});
                }
            }
            await batch.commit(); load();
        };

        document.getElementById('addHoBtn').onclick = async () => {
            let d = prompt("동"); let h = prompt("호수"); if(!d || !h) return;
            if(!d.endsWith("동")) d += "동";
            await setDoc(doc(db, COL, `${d}_${h}`), {id:`${d}_${h}`, dong:d, ho:h, owner:"", ownerPhone:"", tenant:"", tenantPhone:""});
            load();
        };

        document.getElementById('deleteDongBtn').onclick = async () => {
            let d = prompt("삭제할 동 번호"); if(!d) return;
            if(!d.endsWith("동")) d += "동";
            if(confirm(d + "의 정보를 모두 삭제할까요?")) {
                const targets = data.filter(v => v.dong === d);
                const batch = writeBatch(db);
                targets.forEach(v => batch.delete(doc(db, COL, v.id)));
                await batch.commit(); load();
            }
        };

        document.getElementById('delBtn').onclick = async () => {
            if(confirm("삭제할까요?")) { await deleteDoc(doc(db, COL, selected.id)); history.back(); load(); }
        };

        document.getElementById('excelInput').onchange = async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (evt) => {
                const wb = XLSX.read(evt.target.result, { type: 'binary' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                const batch = writeBatch(db);
                rows.forEach(r => {
                    let d = String(r['동']||'').trim(); if(d && !d.endsWith('동')) d+='동';
                    let h = String(r['호']||'').trim(); if(!d || !h) return;
                    const id = d+'_'+h;
                    batch.set(doc(db, COL, id), {id, dong:d, ho:h, owner:String(r['소유주']||''), ownerPhone:String(r['소유주연락처']||''), tenant:String(r['세입자']||''), tenantPhone:String(r['세입자연락처']||'')});
                });
                await batch.commit(); alert("업로드 완료"); load();
            };
            reader.readAsBinaryString(file);
        };

        load();
    </script>
</body>
</html>
