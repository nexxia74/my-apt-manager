<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>입주민 관리 프로그램</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#778899">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        .unit { transition: transform 0.1s; cursor: pointer; }
        .unit:active { transform: scale(0.97); }
        .empty { opacity: 0.4; }
        #hoLayer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f8fafc; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40; overflow-y: auto;
        }
        #hoLayer.show { transform: translateY(-100%); }
        .sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: white; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            transition: 0.3s ease-out; z-index: 60;
        }
        .sheet.show { bottom: 0; }
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; z-index: 50;
        }
        .overlay.show { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="p-4 bg-white shadow-sm sticky top-0 z-20">
        <div class="flex justify-between items-center mb-4">
            <h1 id="mainTitle" class="text-xl font-extrabold text-blue-600">불러오는 중...</h1>
            <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded-full font-bold">4열 모드</span>
        </div>
        <input id="search" placeholder="이름 / 연락처 / 호수 검색" class="w-full border-slate-200 border p-3 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
        
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button id="addDongBtn" class="bg-blue-600 text-white py-2 rounded-lg text-[11px] font-bold">동 추가</button>
            <button id="addHoBtn" class="bg-emerald-600 text-white py-2 rounded-lg text-[11px] font-bold">호 추가</button>
            <label class="bg-amber-500 text-white py-2 rounded-lg text-center cursor-pointer text-[11px] font-bold">
                엑셀<input type="file" id="excelInput" class="hidden">
            </label>
            <button id="deleteDongBtn" class="bg-rose-500 text-white py-2 rounded-lg text-[11px] font-bold">동 삭제</button>
        </div>
    </div>

    <div class="p-4">
        <h3 class="text-xs font-bold text-slate-400 mb-4 ml-1 tracking-wider uppercase">전체 동 목록</h3>
        <div id="dongList" class="grid grid-cols-4 gap-3"></div>
    </div>

    <div id="hoLayer">
        <div class="p-4 bg-white border-b sticky top-0 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="p-2 -ml-2 text-slate-400 text-2xl">←</button>
                <h2 id="currentDongTitle" class="font-bold text-lg text-slate-800"></h2>
            </div>
            <button onclick="history.back()" class="text-blue-600 font-bold text-sm">닫기</button>
        </div>
        <div id="grid" class="p-4 grid grid-cols-2 gap-3"></div>
    </div>

    <div id="overlay" class="overlay" onclick="history.back()"></div>
    <div id="sheet" class="sheet p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 id="detailTitle" class="font-bold text-xl text-slate-800"></h2>
            <button onclick="history.back()" class="text-slate-300 text-2xl">✕</button>
        </div>
        <div class="space-y-6">
            <div class="bg-blue-50/50 p-5 rounded-2xl border border-blue-100">
                <label class="text-base font-black text-blue-700 block mb-2">소유주</label>
                <input id="ownerInput" placeholder="성함 입력" class="w-full bg-transparent border-b border-blue-200 py-2 focus:outline-none text-lg font-bold">
                <input id="ownerPhoneInput" placeholder="연락처 입력" class="w-full bg-transparent py-2 focus:outline-none text-sm mt-1">
            </div>
            <div class="bg-emerald-50/50 p-5 rounded-2xl border border-emerald-100">
                <label class="text-base font-black text-emerald-700 block mb-2">세입자</label>
                <input id="tenantInput" placeholder="성함 입력" class="w-full bg-transparent border-b border-emerald-200 py-2 focus:outline-none text-lg font-bold">
                <input id="tenantPhoneInput" placeholder="연락처 입력" class="w-full bg-transparent py-2 focus:outline-none text-sm mt-1">
            </div>
            <div class="pt-2 flex gap-3">
                <button id="delBtn" class="flex-1 bg-rose-50 text-rose-600 py-4 rounded-2xl font-bold active:bg-rose-100">삭제</button>
                <button onclick="history.back()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold active:bg-blue-700">확인 완료</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // [핵심수정] 단지명 추출 로직: index.html 문자열 완벽 제거
        let path = decodeURIComponent(window.location.pathname);
        path = path.replace(/index\.html$/, ""); // 파일명 제거
        const COMPLEX_NAME = path.replace(/^\/+|\/+$/g, "") || "기본단지"; 
        
        const COL = `complexes/${COMPLEX_NAME}/hos`;
        document.getElementById('mainTitle').innerText = COMPLEX_NAME;

        let data = [], selected = null, timer, currentDong = null;

        async function load() {
            const snap = await getDocs(collection(db, COL));
            data = snap.docs.map(d => d.data());
            renderDong();
            if (currentDong) renderHo(currentDong);
        }

        function renderDong() {
            const dongs = [...new Set(data.map(v => v.dong))].sort((a,b) => parseInt(a)-parseInt(b));
            const dongList = document.getElementById('dongList');
            dongList.innerHTML = dongs.map(d => {
                const num = d.replace('동', '');
                return `
                <button class="bg-white border border-slate-100 rounded-2xl py-4 px-2 shadow-sm active:bg-blue-50 flex items-center justify-center" onclick="openHoLayer('${d}')">
                    <span class="font-black text-[17px] text-slate-700 leading-none">${num}</span>
                    <span class="font-bold text-[15px] text-slate-700 ml-0.5 leading-none">동</span>
                </button>`;
            }).join('');
        }

        window.openHoLayer = (dong) => {
            currentDong = dong;
            document.getElementById('hoLayer').classList.add('show');
            document.getElementById('currentDongTitle').innerText = dong.endsWith('동') ? dong : dong + '동';
            renderHo(dong);
            history.pushState({layer: 'ho'}, '');
        };

        window.openDetail = (id) => {
            selected = data.find(v => v.id === id);
            document.getElementById('sheet').classList.add('show');
            document.getElementById('overlay').classList.add('show');
            document.getElementById('detailTitle').innerText = `${selected.dong} ${selected.ho}호`;
            document.getElementById('ownerInput').value = selected.owner || '';
            document.getElementById('ownerPhoneInput').value = selected.ownerPhone || '';
            document.getElementById('tenantInput').value = selected.tenant || '';
            document.getElementById('tenantPhoneInput').value = selected.tenantPhone || '';
            history.pushState({layer: 'detail'}, '');
        };

        window.onpopstate = (event) => {
            const state = event.state;
            if (!state) {
                document.getElementById('hoLayer').classList.remove('show');
                document.getElementById('sheet').classList.remove('show');
                document.getElementById('overlay').classList.remove('show');
                currentDong = null;
            } else if (state.layer === 'ho') {
                document.getElementById('sheet').classList.remove('show');
                document.getElementById('overlay').classList.remove('show');
            }
        };

        function renderHo(dong) {
            const filtered = data.filter(v => v.dong === dong).sort((a,b) => parseInt(a.ho) - parseInt(b.ho));
            const grid = document.getElementById('grid');
            grid.innerHTML = filtered.map(v => {
                const empty = !v.owner && !v.tenant;
                return `
                    <div class="unit p-4 rounded-2xl bg-white shadow-sm border border-slate-50 ${empty ? 'empty' : ''}" onclick="openDetail('${v.id}')">
                        <div class="font-bold text-slate-800 text-sm">${v.ho}호</div>
                        <div class="text-xs text-blue-600 font-bold mt-1 truncate">${v.owner || '공실'}</div>
                        <div class="text-[10px] text-slate-400 truncate">${v.tenant || ''}</div>
                    </div>`;
            }).join('');
        }

        function autoSave() {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                if (!selected) return;
                const updated = {
                    ...selected,
                    owner: ownerInput.value, ownerPhone: ownerPhoneInput.value,
                    tenant: tenantInput.value, tenantPhone: tenantPhoneInput.value
                };
                await setDoc(doc(db, COL, selected.id), updated);
                Object.assign(selected, updated);
                renderHo(currentDong);
            }, 500);
        }

        [ownerInput, ownerPhoneInput, tenantInput, tenantPhoneInput].forEach(el => el.oninput = autoSave);

        addDongBtn.onclick = async () => {
            let d = prompt("동 번호 (예: 101)"); if (!d) return;
            if (!d.endsWith("동")) d += "동";
            const f = prompt("층 범위 (예: 1~15)"); const p = prompt("세대수"); if(!f || !p) return;
            let [s, e] = f.includes("~") ? f.split("~").map(Number) : [1, Number(f)];
            for (let i = s; i <= e; i++) {
                for (let h = 1; h <= Number(p); h++) {
                    const ho = `${i}${String(h).padStart(2, '0')}`;
                    await setDoc(doc(db, COL, `${d}_${ho}`), { id: `${d}_${ho}`, dong: d, ho, owner: "", ownerPhone: "", tenant: "", tenantPhone: "" });
                }
            }
            load();
        };

        addHoBtn.onclick = async () => {
            let d = prompt("동 번호"); if (!d) return;
            if (!d.endsWith("동")) d += "동";
            const h = prompt("호수"); if (!h) return;
            await setDoc(doc(db, COL, `${d}_${h}`), { id: `${d}_${h}`, dong: d, ho: h, owner: "", ownerPhone: "", tenant: "", tenantPhone: "" });
            load();
        };

        deleteDongBtn.onclick = async () => {
            let d = prompt("삭제할 동 번호"); if (!d) return;
            if (!d.endsWith("동")) d += "동";
            if(!confirm(`${d} 삭제할까요?`)) return;
            data.filter(v => v.dong === d).forEach(async v => await deleteDoc(doc(db, COL, v.id)));
            setTimeout(load, 1000);
        };

        delBtn.onclick = async () => {
            if (!confirm("삭제할까요?")) return;
            await deleteDoc(doc(db, COL, selected.id));
            history.back(); load();
        };

        load();
    </script>
</body>
</html>
