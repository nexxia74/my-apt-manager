<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단지 관리 시스템 (완성형 UI)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.unit-card{transition:.2s;border-width:2px;min-height:80px}
.empty{opacity:.4}
.active{outline:3px solid #3b82f6}
</style>
</head>
<body class="bg-slate-100">

<div class="flex h-screen">

<!-- 좌측 동 리스트 -->
<div class="w-40 bg-white border-r overflow-y-auto" id="dongList"></div>

<!-- 중앙 -->
<div class="flex-1 flex flex-col">

<!-- 상단 -->
<div class="p-3 bg-white shadow flex gap-2">
<input id="searchInput" placeholder="검색" class="flex-1 p-2 border rounded">
<select id="floorFilter" class="border p-2 rounded">
<option value="">전체층</option>
</select>
<button id="btnDeleteDong" class="bg-red-500 text-white px-3 rounded">동 삭제</button>
</div>

<!-- 그리드 -->
<div id="grid" class="p-3 grid grid-cols-4 gap-2 overflow-y-auto"></div>
</div>

<!-- 우측 패널 -->
<div class="w-80 bg-white border-l p-4 hidden" id="panel">
<h2 class="text-lg font-bold mb-3" id="panelTitle">호 정보</h2>

<label class="text-xs text-gray-500">소유주</label>
<input id="owner" class="w-full border p-2 mb-3">

<label class="text-xs text-gray-500">연락처</label>
<input id="phone" class="w-full border p-2 mb-3">

<label class="text-xs text-gray-500">세입자</label>
<textarea id="tenant" class="w-full border p-2 mb-4"></textarea>

<div class="flex gap-2">
<button id="saveBtn" class="flex-1 bg-blue-600 text-white p-2 rounded">저장</button>
<button id="deleteBtn" class="flex-1 bg-red-500 text-white p-2 rounded">삭제</button>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",authDomain:"apt-member-id.firebaseapp.com",projectId:"apt-member-id"});
const db=getFirestore(app);

const COMPLEX_ID="기본단지";
let data=[];
let selectedDong=null;
let selectedUnit=null;
let collapsed={};

async function load(){
const dongs=await getDocs(collection(db,`complexes/${COMPLEX_ID}/dongs`));
data=[];
for(const d of dongs.docs){
const hos=await getDocs(collection(db,`complexes/${COMPLEX_ID}/dongs/${d.id}/hos`));
hos.forEach(h=>data.push({...h.data(),dong:d.id,ho:h.id}));
}
renderDongList();
renderGrid();
renderFloorFilter();
}

function renderDongList(){
const el=document.getElementById('dongList');
const dongs=[...new Set(data.map(v=>v.dong))];
el.innerHTML=dongs.map(d=>`<div class='p-2 border-b flex justify-between cursor-pointer ${selectedDong===d?'bg-blue-100':''}'>
<span data-d='${d}'>${d}동</span>
<button data-t='${d}'>${collapsed[d]?'▶':'▼'}</button>
</div>`).join('');

el.querySelectorAll('[data-d]').forEach(e=>{
e.onclick=()=>{selectedDong=e.dataset.d;renderGrid();renderDongList();}
});

el.querySelectorAll('[data-t]').forEach(btn=>{
btn.onclick=(e)=>{
e.stopPropagation();
const d=e.target.dataset.t;
collapsed[d]=!collapsed[d];
renderGrid();renderDongList();
}
});
}

function renderFloorFilter(){
const floors=[...new Set(data.map(v=>v.ho.substring(0,v.ho.length-2)))];
const sel=document.getElementById('floorFilter');
sel.innerHTML='<option value="">전체층</option>' + floors.map(f=>`<option>${f}</option>`).join('');
}

function renderGrid(){
const el=document.getElementById('grid');
let list=data;
const floor=document.getElementById('floorFilter').value;

if(selectedDong) list=list.filter(v=>v.dong===selectedDong);
if(floor) list=list.filter(v=>v.ho.startsWith(floor));
list=list.filter(v=>!collapsed[v.dong]);

el.innerHTML=list.map(v=>{
const empty=!v.owner&&!v.tenant;
const active=selectedUnit && selectedUnit.ho===v.ho && selectedUnit.dong===v.dong;
return `<div class='unit-card p-2 border rounded bg-white cursor-pointer ${empty?'empty':''} ${active?'active':''}' data-d='${v.dong}' data-h='${v.ho}'>
<div class='font-bold'>${v.ho}</div>
<div class='text-xs'>${v.owner||'-'}</div>
</div>`;
}).join('');

el.querySelectorAll('.unit-card').forEach(c=>{
c.onclick=()=>openPanel(c.dataset.d,c.dataset.h);
});
}

function openPanel(d,h){
selectedUnit=data.find(v=>v.dong===d&&v.ho===h);
const p=document.getElementById('panel');
p.classList.remove('hidden');

panelTitle.innerText=`${d}동 ${h}호 정보 수정`;
owner.value=selectedUnit.owner||'';
phone.value=selectedUnit.phone||'';
tenant.value=selectedUnit.tenant||'';

renderGrid();
}

saveBtn.onclick=async()=>{
await setDoc(doc(db,`complexes/${COMPLEX_ID}/dongs/${selectedUnit.dong}/hos/${selectedUnit.ho}`),{
owner:owner.value,phone:phone.value,tenant:tenant.value
});
load();
};

deleteBtn.onclick=async()=>{
if(!confirm('삭제하시겠습니까?')) return;
await deleteDoc(doc(db,`complexes/${COMPLEX_ID}/dongs/${selectedUnit.dong}/hos/${selectedUnit.ho}`));
selectedUnit=null;
document.getElementById('panel').classList.add('hidden');
load();
};

btnDeleteDong.onclick=async()=>{
const d=prompt('삭제할 동');
if(!d) return;
const hos=await getDocs(collection(db,`complexes/${COMPLEX_ID}/dongs/${d}/hos`));
for(const h of hos.docs) await deleteDoc(h.ref);
load();
};

searchInput.addEventListener('input',e=>{
const k=e.target.value.toLowerCase();
if(!k) return renderGrid();
const list=data.filter(v=>
(v.owner||'').toLowerCase().includes(k)||
(v.phone||'').includes(k)||
v.ho.includes(k)
);
const el=document.getElementById('grid');
el.innerHTML=list.map(v=>`<div class='p-2 border'>${v.dong}-${v.ho}</div>`).join('');
});

floorFilter.onchange=renderGrid;

load();
</script>
</body>
</html>
