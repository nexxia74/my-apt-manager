<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단지 관리 시스템 (reCAPTCHA 제거)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
.unit-card{transition:.2s;border-width:2px;min-height:80px}
.highlight{background:#fef08a!important}
</style>
</head>
<body class="bg-slate-50 p-3">
<div class="max-w-6xl mx-auto">

<h1 class="text-xl font-bold mb-3 text-center">단지 관리</h1>

<div class="bg-white p-3 rounded-xl shadow mb-4 sticky top-2 z-40">
<input id="searchInput" placeholder="검색" class="w-full p-2 border rounded mb-2">
<div class="grid grid-cols-3 gap-2">
<button onclick="addDongUI()" class="bg-blue-500 text-white p-2 rounded text-sm">동 생성</button>
<button onclick="addSingleUnit()" class="bg-green-500 text-white p-2 rounded text-sm">호 추가</button>
<label class="bg-orange-500 text-white p-2 rounded text-sm text-center cursor-pointer">
엑셀
<input type="file" id="excelInput" class="hidden">
</label>
</div>
</div>

<div id="apartmentContainer" class="grid grid-cols-2 gap-2"></div>
</div>

<!-- 동 생성 모달 -->
<div id="dongModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center">
<div class="bg-white p-4 rounded-xl w-80">
<h2 class="font-bold mb-2">동 자동 생성</h2>
<input id="dongNum" placeholder="동 (예:101)" class="w-full border p-2 mb-2">
<input id="startFloor" placeholder="시작층" class="w-full border p-2 mb-2">
<input id="endFloor" placeholder="끝층" class="w-full border p-2 mb-2">
<input id="perFloor" placeholder="층당 세대수" class="w-full border p-2 mb-2">
<div class="flex gap-2">
<button onclick="createDong()" class="flex-1 bg-blue-600 text-white p-2">생성</button>
<button onclick="dongModal.classList.add('hidden')" class="flex-1 bg-gray-200 p-2">취소</button>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",authDomain:"apt-member-id.firebaseapp.com",projectId:"apt-member-id"};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const COMPLEX_ID="기본단지";
let timer,lastSave=0;

function makeKeywords(d){return[d.owner?.toLowerCase()||'',d.phone||'',d.ho||'']}

function canSave(){
const now=Date.now();
if(now-lastSave<500)return false;
lastSave=now;
return true;
}

async function save(dong,ho,data){
if(!canSave()) return;
await setDoc(doc(db,`complexes/${COMPLEX_ID}/dongs/${dong}/hos/${ho}`),data);
await setDoc(doc(db,`complexes/${COMPLEX_ID}/allHos/${dong}_${ho}`),{...data,dong,ho,keywords:makeKeywords({...data,ho})});
}

async function createDong(){
const d=dongNum.value;
const s=parseInt(startFloor.value);
const e=parseInt(endFloor.value);
const p=parseInt(perFloor.value);

for(let f=s;f<=e;f++){
for(let h=1;h<=p;h++){
const ho=`${f}${h.toString().padStart(2,'0')}`;
await save(d,ho,{owner:'',tenant:'',phone:''});
}
}

alert('생성 완료');
dongModal.classList.add('hidden');
loadAll();
}

async function loadAll(){
const dongs=await getDocs(collection(db,`complexes/${COMPLEX_ID}/dongs`));
let list=[];
for(const d of dongs.docs){
const hos=await getDocs(collection(db,`complexes/${COMPLEX_ID}/dongs/${d.id}/hos`));
hos.forEach(h=>list.push({...h.data(),dong:d.id,ho:h.id}));
}
render(list);
}

function render(list){
const el=document.getElementById('apartmentContainer');
el.innerHTML=list.map(v=>`<div class='unit-card p-2 border rounded bg-white text-sm'>
<div class='font-bold'>${v.dong}-${v.ho}</div>
<div>${v.owner||'-'}</div>
</div>`).join('');
}

async function search(k){
if(!k)return loadAll();
const q=query(collection(db,`complexes/${COMPLEX_ID}/allHos`),where('keywords','array-contains',k.toLowerCase()));
const s=await getDocs(q);
render(s.docs.map(d=>d.data()));
}

window.addDongUI=()=>dongModal.classList.remove('hidden');
window.addSingleUnit=async()=>{const d=prompt('동');const h=prompt('호');if(d&&h)await save(d,h,{owner:'',tenant:'',phone:''});loadAll();}

searchInput.addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>search(e.target.value.trim()),300)});

excelInput.addEventListener('change',e=>{
const f=e.target.files[0];const r=new FileReader();
r.onload=async evt=>{
const wb=XLSX.read(evt.target.result,{type:'binary'});
const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
for(const row of rows.slice(1)){
if(!row[0]||!row[1])continue;
await save(String(row[0]),String(row[1]),{owner:String(row[2]||''),phone:String(row[3]||''),tenant:String(row[4]||'')});
}
alert('업로드 완료');loadAll();
};
r.readAsBinaryString(f);
});

loadAll();
</script>
</body>
</html>
