<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APT Manager MOBILE FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        /* 기본 스타일 및 터치 방지 */
        body { -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        .unit { transition: transform 0.1s; cursor: pointer; }
        .unit:active { transform: scale(0.97); }
        .empty { opacity: 0.4; }
        
        /* [레이어 1] 호수 목록 전체 화면 (동 클릭 시) */
        #hoLayer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f8fafc; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 40; overflow-y: auto;
        }
        #hoLayer.show { transform: translateY(-100%); }

        /* [레이어 2] 상세 정보 수정 시트 (호수 클릭 시) */
        .sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: white; border-radius: 24px 24px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
            transition: 0.3s ease-out; z-index: 60;
        }
        .sheet.show { bottom: 0; }

        /* 배경 오버레이 */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4);
            display: none; z-index: 50;
        }
        .overlay.show { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="p-4 bg-white shadow-sm sticky top-0 z-20">
        <div class="flex justify-between items-center mb-4">
            <h1 id="mainTitle" class="text-xl font-extrabold text-blue-600">단지 관리</h1>
            <span class="text-[10px] bg-blue-100 text-blue-600 px-2 py-1 rounded-full font-bold">MOBILE VER</span>
        </div>
        <input id="search" placeholder="이름 / 연락처 / 호수 검색" class="w-full border-slate-200 border p-3 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <div class="grid grid-cols-4 gap-2 mt-4">
            <button id="addDong" class="bg-blue-600 text-white py-2 rounded-lg text-[11px] font-bold">동 추가</button>
            <button id="addHo" class="bg-emerald-600 text-white py-2 rounded-lg text-[11px] font-bold">호 추가</button>
            <label class="bg-amber-500 text-white py-2 rounded-lg text-center cursor-pointer text-[11px] font-bold">
                엑셀업로드<input type="file" id="excelInput" class="hidden">
            </label>
            <button id="deleteDong" class="bg-rose-500 text-white py-2 rounded-lg text-[11px] font-bold">동 삭제</button>
        </div>
    </div>

    <div class="p-4">
        <h3 class="text-xs font-bold text-slate-400 mb-3 ml-1 uppercase tracking-wider">Dong List</h3>
        <div id="dongList" class="grid grid-cols-5 gap-3"></div>
    </div>

    <div id="hoLayer">
        <div class="p-4 bg-white border-b sticky top-0 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="p-2 -ml-2 text-slate-400 text-2xl">←</button>
                <h2 id="currentDongTitle" class="font-bold text-lg"></h2>
            </div>
            <button onclick="history.back()" class="text-blue-600 font-bold text-sm">완료</button>
        </div>
        <div id="grid" class="p-4 grid grid-cols-2 gap-3"></div>
    </div>

    <div id="overlay" class="overlay" onclick="history.back()"></div>
    <div id="sheet" class="sheet p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 id="detailTitle" class="font-bold text-xl text-slate-800"></h2>
            <button onclick="history.back()" class="text-slate-300 text-2xl">✕</button>
        </div>
        <div class="space-y-5">
            <div class="bg-slate-50 p-4 rounded-2xl">
                <label class="text-[11px] font-bold text-blue-500 uppercase">Owner (소유주)</label>
                <input id="owner" placeholder="이름 입력" class="w-full bg-transparent border-b border-slate-200 py-2 focus:outline-none text-lg">
                <input id="ownerPhone" placeholder="연락처 입력" class="w-full bg-transparent py-2 focus:outline-none text-sm mt-1">
            </div>
            <div class="bg-slate-50 p-4 rounded-2xl">
                <label class="text-[11px] font-bold text-emerald-500 uppercase">Tenant (세입자)</label>
                <input id="tenant" placeholder="이름 입력" class="w-full bg-transparent border-b border-slate-200 py-2 focus:outline-none text-lg">
                <input id="tenantPhone" placeholder="연락처 입력" class="w-full bg-transparent py-2 focus:outline-none text-sm mt-1">
            </div>
            <div class="pt-4 flex gap-3">
                <button id="del" class="flex-1 bg-rose-50 text-rose-600 py-4 rounded-2xl font-bold active:bg-rose-100">삭제</button>
                <button onclick="history.back()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 active:bg-blue-700">정보 확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const pathName = decodeURIComponent(window.location.pathname.replace(/^\//, ""));
        const COMPLEX_NAME = pathName || "기본단지"; 
        const COL = `complexes/${COMPLEX_NAME}/hos`;

        document.getElementById('mainTitle').innerText = COMPLEX_NAME;

        let data = [], selected = null, timer;
        let currentDong = null;

        // 데이터 로드
        async function load() {
            const snap = await getDocs(collection(db, COL));
            data = snap.docs.map(d => d.data());
            renderDong();
            if (currentDong) renderHo(currentDong);
        }

        // 메인 동 리스트 (5열)
        function renderDong() {
            const dongs = [...new Set(data.map(v => v.dong))].sort((a,b) => parseInt(a)-parseInt(b));
            const dongList = document.getElementById('dongList');
            dongList.innerHTML = dongs.map(d => `
                <button class="bg-white border border-slate-100 rounded-2xl p-4 shadow-sm active:bg-blue-50 text-center" onclick="openHoLayer('${d}')">
                    <div class="text-[9px] text-slate-400 font-bold mb-1 uppercase">DONG</div>
                    <div class="font-black text-lg text-slate-700">${d.replace('동','')}</div>
                </button>
            `).join('');
        }

        // 레이어 제어 (뒤로가기 대응)
        window.openHoLayer = (dong) => {
            currentDong = dong;
            document.getElementById('hoLayer').classList.add('show');
            document.getElementById('currentDongTitle').innerText = `${dong}`;
            renderHo(dong);
            history.pushState({layer: 'ho'}, '');
        };

        window.openDetail = (id) => {
            selected = data.find(v => v.id === id);
            document.getElementById('sheet').classList.add('show');
            document.getElementById('overlay').classList.add('show');
            document.getElementById('detailTitle').innerText = `${selected.dong} ${selected.ho}호`;
            document.getElementById('owner').value = selected.owner || '';
            document.getElementById('ownerPhone').value = selected.ownerPhone || '';
            document.getElementById('tenant').value = selected.tenant || '';
            document.getElementById('tenantPhone').value = selected.tenantPhone || '';
            history.pushState({layer: 'detail'}, '');
        };

        // 닫기 통합 함수 (Popstate에서 호출)
        function closeAll() {
            document.getElementById('sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('hoLayer').classList.remove('show');
            currentDong = null;
        }

        window.onpopstate = () => closeAll();

        function renderHo(dong) {
            const filtered = data.filter(v => v.dong === dong).sort((a,b) => parseInt(a.ho) - parseInt(b.ho));
            const grid = document.getElementById('grid');
            grid.innerHTML = filtered.map(v => {
                const empty = !v.owner && !v.tenant;
                return `
                    <div class="unit p-4 rounded-2xl bg-white shadow-sm border border-slate-50 ${empty ? 'empty' : ''}" onclick="openDetail('${v.id}')">
                        <div class="font-bold text-slate-800 text-sm">${v.ho}호</div>
                        <div class="text-xs text-blue-500 font-bold mt-1 truncate">${v.owner || '공실'}</div>
                        <div class="text-[10px] text-slate-400 truncate">${v.tenant || ''}</div>
                    </div>`;
            }).join('');
        }

        // 자동 저장
        function autoSave() {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                if (!selected) return;
                const updated = {
                    ...selected,
                    owner: owner.value, ownerPhone: ownerPhone.value,
                    tenant: tenant.value, tenantPhone: tenantPhone.value
                };
                await setDoc(doc(db, COL, selected.id), updated);
                Object.assign(selected, updated); // 로컬 데이터 갱신
                renderHo(currentDong); // 레이어 화면 갱신
            }, 500);
        }

        [owner, ownerPhone, tenant, tenantPhone].forEach(el => el.oninput = autoSave);

        // 동/호 추가 및 삭제 로직
        addDong.onclick = async () => {
            let d = prompt("추가할 동 번호 (숫자만)"); if (!d) return; if (!d.endsWith("동")) d += "동";
            const f = prompt("층 범위 (예: 1~15)"); const p = prompt("세대수 (예: 4)"); if(!f || !p) return;
            let s, e; if (f.includes("~")) [s, e] = f.split("~").map(Number); else { s = 1; e = Number(f); }
            for (let i = s; i <= e; i++) {
                for (let h = 1; h <= Number(p); h++) {
                    const ho = `${i}${String(h).padStart(2, '0')}`;
                    const id = `${d}_${ho}`;
                    await setDoc(doc(db, COL, id), { id, dong: d, ho, owner: "", ownerPhone: "", tenant: "", tenantPhone: "" });
                }
            }
            load();
        };

        addHo.onclick = async () => {
            let d = prompt("동 번호"); if (!d) return; if (!d.endsWith("동")) d += "동";
            const h = prompt("호수"); if (!h) return;
            await setDoc(doc(db, COL, `${d}_${h}`), { id: `${d}_${h}`, dong: d, ho: h, owner: "", ownerPhone: "", tenant: "", tenantPhone: "" });
            load();
        };

        deleteDong.onclick = async () => {
            let d = prompt("삭제할 동 이름"); if (!d) return; if (!d.endsWith("동")) d += "동";
            if(!confirm(`${d}의 모든 정보를 삭제할까요?`)) return;
            const list = data.filter(v => v.dong === d);
            for (const v of list) await deleteDoc(doc(db, COL, v.id));
            load();
        };

        del.onclick = async () => {
            if (!confirm("이 세대 정보를 삭제할까요?")) return;
            await deleteDoc(doc(db, COL, selected.id));
            history.back(); load();
        };

        // 검색 기능
        search.oninput = e => {
            const k = e.target.value.toLowerCase();
            if (!k) { renderDong(); return; }
            // 검색 시에는 동 버튼 대신 검색된 호수들을 메인에 바로 뿌려주거나, 
            // 현재는 기존 동 리스트 유지 상태에서 로직을 확장할 수 있습니다.
        };

        load();
    </script>
</body>
</html>
