<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>입주민 관리 시스템</title>

    <script>
        (function() {
            const path = window.location.pathname;
            const decodedPath = decodeURIComponent(path);
            // 주소에서 단지명만 추출 (예: /캠스베일리 -> 캠스베일리)
            const complexName = decodedPath.replace(/^\/+|\/+$/g, "").replace(/index\.html$/, "") || "입주민관리";

            const myManifest = {
                "name": complexName,
                "short_name": complexName,
                "start_url": path, 
                "display": "standalone",
                "background_color": "#778899",
                "theme_color": "#778899",
                "icons": [
                    { "src": "/icon.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
                    { "src": "/icon.png", "sizes": "512x512", "type": "image/png", "purpose": "any" }
                ]
            };

            const blob = new Blob([JSON.stringify(myManifest)], {type: 'application/json'});
            const manifestURL = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);
        })();
    </script>

    <link rel="apple-touch-icon" href="/icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: sans-serif; overflow-x: hidden; }
        .unit { transition: transform 0.1s; cursor: pointer; border: 1px solid #f1f5f9; }
        .unit:active { transform: scale(0.95); background-color: #f8fafc; }
        .empty { opacity: 0.5; background-color: #fcfcfc; }
        #hoLayer {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #f8fafc; transition: transform 0.3s ease-in-out; z-index: 40; overflow-y: auto;
        }
        #hoLayer.show { transform: translateY(-100%); }
        .sheet {
            position: fixed; bottom: -100%; left: 0; width: 100%; background: white; 
            border-radius: 24px 24px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            transition: 0.3s ease-out; z-index: 60; padding: 24px;
        }
        .sheet.show { bottom: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 50; }
        .overlay.show { display: block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="p-4 bg-white shadow-sm sticky top-0 z-20">
        <div class="flex justify-between items-center mb-4">
            <h1 id="mainTitle" class="text-xl font-black text-blue-600">연결 중...</h1>
            <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded-full font-bold">자동 동기화</span>
        </div>
        <input id="search" placeholder="이름 / 연락처 / 호수 검색" class="w-full border-slate-200 border p-3 rounded-xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm mb-4">
        <div class="grid grid-cols-4 gap-2">
            <button id="addDongBtn" class="bg-slate-800 text-white py-2 rounded-lg text-[10px] font-bold">동 추가</button>
            <button id="addHoBtn" class="bg-slate-800 text-white py-2 rounded-lg text-[10px] font-bold">호 추가</button>
            <button onclick="location.reload()" class="bg-slate-100 text-slate-600 py-2 rounded-lg text-[10px] font-bold">새로고침</button>
            <button id="deleteDongBtn" class="bg-rose-50 text-rose-600 py-2 rounded-lg text-[10px] font-bold">동 삭제</button>
        </div>
    </div>

    <div class="p-4">
        <h3 class="text-[11px] font-bold text-slate-400 mb-4 ml-1 tracking-widest uppercase">단지 내 동 목록</h3>
        <div id="dongList" class="grid grid-cols-4 gap-3"></div>
    </div>

    <div id="hoLayer">
        <div class="p-4 bg-white border-b sticky top-0 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <button onclick="history.back()" class="p-2 text-slate-400 text-2xl">←</button>
                <h2 id="currentDongTitle" class="font-bold text-lg"></h2>
            </div>
            <button onclick="history.back()" class="text-blue-600 font-bold text-sm">닫기</button>
        </div>
        <div id="grid" class="p-4 grid grid-cols-2 gap-3 pb-24"></div>
    </div>

    <div id="overlay" class="overlay" onclick="history.back()"></div>
    <div id="sheet" class="sheet">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <h2 id="detailTitle" class="font-bold text-xl mb-6 text-slate-800"></h2>
        <div class="space-y-4">
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p class="text-xs font-bold text-blue-600 mb-2">소유주</p>
                <input id="ownerInput" placeholder="성함 입력" class="w-full bg-transparent border-b border-slate-200 py-1 font-bold text-lg focus:outline-none">
                <input id="ownerPhoneInput" placeholder="연락처 입력" class="w-full bg-transparent py-2 focus:outline-none text-sm text-slate-500">
            </div>
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-100">
                <p class="text-xs font-bold text-emerald-600 mb-2">세입자</p>
                <input id="tenantInput" placeholder="성함 입력" class="w-full bg-transparent border-b border-slate-200 py-1 font-bold text-lg focus:outline-none">
                <input id="tenantPhoneInput" placeholder="연락처 입력" class="w-full bg-transparent py-2 focus:outline-none text-sm text-slate-500">
            </div>
            <div class="flex gap-3 pt-4">
                <button id="delBtn" class="flex-1 py-4 text-rose-500 font-bold">삭제</button>
                <button onclick="history.back()" class="flex-[2] bg-slate-900 text-white py-4 rounded-2xl font-bold">저장 및 닫기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
            authDomain: "apt-member-id.firebaseapp.com",
            projectId: "apt-member-id"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // [단지 추출 로직] 주소창에서 단지명만 정확히 가져와 DB 경로로 사용
        const path = decodeURIComponent(window.location.pathname);
        const COMPLEX_NAME = path.replace(/^\/+|\/+$/g, "").replace(/index\.html$/, "") || "기본단지";
        const COL = `complexes/${COMPLEX_NAME}/hos`;

        document.getElementById('mainTitle').innerText = COMPLEX_NAME;

        let data = [], selected = null, timer, currentDong = null;

        async function load() {
            const snap = await getDocs(collection(db, COL));
            data = snap.docs.map(d => d.data());
            renderDong();
            if (currentDong) renderHo(currentDong);
        }

        function renderDong() {
            const dongs = [...new Set(data.map(v => v.dong))].sort((a,b) => parseInt(a)-parseInt(b));
            document.getElementById('dongList').innerHTML = dongs.map(d => `
                <button onclick="openHoLayer('${d}')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 active:bg-slate-50 text-center">
                    <div class="text-lg font-black text-slate-700">${d.replace('동','')}</div>
                    <div class="text-[10px] font-bold text-slate-400 uppercase leading-none">Dong</div>
                </button>
            `).join('');
        }

        window.openHoLayer = (dong) => {
            currentDong = dong;
            document.getElementById('hoLayer').classList.add('show');
            document.getElementById('currentDongTitle').innerText = dong;
            renderHo(dong);
            history.pushState({layer: 'ho'}, '');
        };

        window.openDetail = (id) => {
            selected = data.find(v => v.id === id);
            document.getElementById('sheet').classList.add('show');
            document.getElementById('overlay').classList.add('show');
            document.getElementById('detailTitle').innerText = `${selected.dong} ${selected.ho}호`;
            document.getElementById('ownerInput').value = selected.owner || '';
            document.getElementById('ownerPhoneInput').value = selected.ownerPhone || '';
            document.getElementById('tenantInput').value = selected.tenant || '';
            document.getElementById('tenantPhoneInput').value = selected.tenantPhone || '';
            history.pushState({layer: 'detail'}, '');
        };

        window.onpopstate = (e) => {
            document.getElementById('hoLayer').classList.toggle('show', e.state?.layer === 'ho' || e.state?.layer === 'detail');
            document.getElementById('sheet').classList.toggle('show', e.state?.layer === 'detail');
            document.getElementById('overlay').classList.toggle('show', e.state?.layer === 'detail');
        };

        function renderHo(dong) {
            const filtered = data.filter(v => v.dong === dong).sort((a,b) => parseInt(a.ho) - parseInt(b.ho));
            document.getElementById('grid').innerHTML = filtered.map(v => `
                <div onclick="openDetail('${v.id}')" class="unit p-4 rounded-2xl bg-white ${(!v.owner && !v.tenant) ? 'empty' : ''}">
                    <div class="text-[11px] font-bold text-slate-400 mb-1">${v.ho}호</div>
                    <div class="font-bold text-slate-800 truncate text-sm">${v.owner || '공실'}</div>
                    <div class="text-[10px] text-blue-500 font-medium truncate">${v.tenant || ''}</div>
                </div>
            `).join('');
        }

        function autoSave() {
            clearTimeout(timer);
            timer = setTimeout(async () => {
                if (!selected) return;
                const update = { ...selected, owner: ownerInput.value, ownerPhone: ownerPhoneInput.value, tenant: tenantInput.value, tenantPhone: tenantPhoneInput.value };
                await setDoc(doc(db, COL, selected.id), update);
                Object.assign(selected, update);
                renderHo(currentDong);
            }, 500);
        }

        [ownerInput, ownerPhoneInput, tenantInput, tenantPhoneInput].forEach(el => el.oninput = autoSave);

        search.oninput = () => {
            const val = search.value.toLowerCase();
            if(!val) { renderDong(); return; }
            const filtered = data.filter(v => v.ho.includes(val) || v.owner.includes(val) || v.tenant.includes(val) || (v.ownerPhone && v.ownerPhone.includes(val)));
            // 검색 시에는 전체 결과를 리스트업하는 등의 추가 구현이 가능합니다.
        };

        addDongBtn.onclick = async () => {
            let d = prompt("동 번호 (예: 101)"); if(!d) return;
            if(!d.endsWith("동")) d += "동";
            const f = prompt("층 범위 (예: 1~15)"); const p = prompt("한 층 세대수 (예: 4)"); if(!f || !p) return;
            let [s, e] = f.includes("~") ? f.split("~").map(Number) : [1, Number(f)];
            for(let i=s; i<=e; i++) {
                for(let h=1; h<=Number(p); h++) {
                    const ho = `${i}${String(h).padStart(2, '0')}`;
                    await setDoc(doc(db, COL, `${d}_${ho}`), {id:`${d}_${ho}`, dong:d, ho, owner:"", ownerPhone:"", tenant:"", tenantPhone:""});
                }
            }
            load();
        };

        addHoBtn.onclick = async () => {
            let d = prompt("동"); let h = prompt("호수"); if(!d || !h) return;
            if(!d.endsWith("동")) d += "동";
            await setDoc(doc(db, COL, `${d}_${h}`), {id:`${d}_${h}`, dong:d, ho:h, owner:"", ownerPhone:"", tenant:"", tenantPhone:""});
            load();
        };

        deleteDongBtn.onclick = async () => {
            let d = prompt("삭제할 동"); if(!d) return;
            if(!d.endsWith("동")) d += "동";
            if(confirm(d + "의 모든 호수를 삭제할까요?")) {
                const targets = data.filter(v => v.dong === d);
                for(const v of targets) await deleteDoc(doc(db, COL, v.id));
                load();
            }
        };

        delBtn.onclick = async () => {
            if(confirm("이 호수의 정보를 영구 삭제할까요?")) {
                await deleteDoc(doc(db, COL, selected.id));
                history.back(); load();
            }
        };

        load();
    </script>
</body>
</html>
