<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APT Manager Final</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

<style>
.unit{transition:.2s}
.empty{opacity:.4}
.sheet{
position:fixed;
bottom:-100%;
left:0;
width:100%;
background:white;
border-radius:20px 20px 0 0;
box-shadow:0 -10px 30px rgba(0,0,0,.2);
transition:.3s;
z-index:50;
}
.sheet.show{bottom:0}
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.3);
z-index:40;
display:none;
}
.overlay.show{display:block}
</style>
</head>

<body class="bg-slate-100">

<!-- 🔍 검색 -->
<div class="p-3 bg-white shadow">
<input id="search" placeholder="이름 / 연락처 / 101-101 검색" class="w-full border p-2 rounded">
</div>

<!-- 버튼 -->
<div class="p-2 grid grid-cols-4 gap-2">
<button id="addDong" class="bg-blue-500 text-white p-2 rounded">동 추가</button>
<button id="addHo" class="bg-green-500 text-white p-2 rounded">호 추가</button>

<label class="bg-orange-500 text-white p-2 rounded text-center cursor-pointer">
엑셀<input type="file" id="excelInput" class="hidden">
</label>

<button id="deleteDong" class="bg-red-500 text-white p-2 rounded">동 삭제</button>
</div>

<!-- 동 리스트 -->
<div id="dongList" class="flex overflow-x-auto gap-2 p-2"></div>

<!-- 카드 -->
<div id="grid" class="p-2 grid grid-cols-2 gap-2"></div>

<!-- 오버레이 -->
<div id="overlay" class="overlay"></div>

<!-- 패널 -->
<div id="sheet" class="sheet p-4">
<h2 id="title" class="font-bold mb-3 text-lg"></h2>

<input id="owner" placeholder="소유주" class="w-full border p-2 mb-2">
<input id="ownerPhone" placeholder="소유주 연락처" class="w-full border p-2 mb-2">

<input id="tenant" placeholder="세입자" class="w-full border p-2 mb-2">
<input id="tenantPhone" placeholder="세입자 연락처" class="w-full border p-2 mb-3">

<button id="del" class="w-full bg-red-500 text-white p-2">삭제</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
authDomain:"apt-member-id.firebaseapp.com",
projectId:"apt-member-id"
});

const db=getFirestore(app);
const COL="complexes/기본단지/hos";

let data=[],selected=null,timer;
let selectedDong=null;
let collapsed={};

/* 로드 */
async function load(){
const snap=await getDocs(collection(db,COL));
data=snap.docs.map(d=>d.data());

renderDong();
render();
}

/* 동 리스트 */
function renderDong(){
const dongs=[...new Set(data.map(v=>v.dong))];

dongList.innerHTML=dongs.map(d=>{
return `
<button class="px-3 py-1 border rounded ${selectedDong===d?'bg-blue-500 text-white':''}" data-d="${d}">
${collapsed[d]?'▶':'▼'} ${d}
</button>`;
}).join('');

dongList.querySelectorAll('button').forEach(b=>{
b.onclick=()=>{
const d=b.dataset.d;

if(selectedDong===d){
collapsed[d]=!collapsed[d];
}else{
selectedDong=d;
}

renderDong();
render();
};
});
}

/* 카드 */
function render(list=data){
let l=list;

if(selectedDong) l=l.filter(v=>v.dong===selectedDong);
if(selectedDong && collapsed[selectedDong]) l=[];

grid.innerHTML=l.map(v=>{
const empty=!v.owner&&!v.tenant;

return `
<div class="unit p-3 border rounded bg-white ${empty?'empty':''}" data-id="${v.id}">
<div class="font-bold">${v.dong}-${v.ho}</div>
<div class="text-xs">${v.owner||'-'}</div>
<div class="text-xs text-gray-500">${v.tenant||''}</div>
</div>`;
}).join('');

grid.querySelectorAll('.unit').forEach(c=>{
c.onclick=()=>open(c.dataset.id);
});
}

/* 패널 */
function open(id){
selected=data.find(v=>v.id===id);

sheet.classList.add('show');
overlay.classList.add('show');

title.innerText=`${selected.dong}-${selected.ho}`;
owner.value=selected.owner||'';
ownerPhone.value=selected.ownerPhone||'';
tenant.value=selected.tenant||'';
tenantPhone.value=selected.tenantPhone||'';
}

/* 바깥 클릭 닫기 */
overlay.onclick=()=>{
sheet.classList.remove('show');
overlay.classList.remove('show');
};

/* 자동 저장 */
function autoSave(){
clearTimeout(timer);
timer=setTimeout(async()=>{
if(!selected)return;

await setDoc(doc(db,COL,selected.id),{
...selected,
owner:owner.value,
ownerPhone:ownerPhone.value,
tenant:tenant.value,
tenantPhone:tenantPhone.value
});
load();
},400);
}

owner.oninput=autoSave;
ownerPhone.oninput=autoSave;
tenant.oninput=autoSave;
tenantPhone.oninput=autoSave;

/* 삭제 */
del.onclick=async()=>{
if(!confirm("삭제?"))return;
await deleteDoc(doc(db,COL,selected.id));
sheet.classList.remove('show');
overlay.classList.remove('show');
load();
};

/* 동 생성 */
addDong.onclick=async()=>{
const d=prompt("동");
const f=prompt("층수 (1~10)");
const p=prompt("세대");

let s,e;
if(f.includes("~")) [s,e]=f.split("~").map(Number);
else {s=1;e=Number(f);}

for(let i=s;i<=e;i++){
for(let h=1;h<=p;h++){
const ho=`${i}${String(h).padStart(2,'0')}`;
const id=`${d}_${ho}`;

await setDoc(doc(db,COL,id),{
id,dong:d,ho,
owner:"",ownerPhone:"",
tenant:"",tenantPhone:""
});
}}
load();
};

/* 호 추가 */
addHo.onclick=async()=>{
const d=prompt("동");
const h=prompt("호");

const id=`${d}_${h}`;

await setDoc(doc(db,COL,id),{
id,dong:d,ho:h,
owner:"",ownerPhone:"",
tenant:"",tenantPhone:""
});
load();
};

/* 동 삭제 */
deleteDong.onclick=async()=>{
const d=prompt("삭제할 동");
const list=data.filter(v=>v.dong===d);

for(const v of list){
await deleteDoc(doc(db,COL,v.id));
}
load();
};

/* 엑셀 */
excelInput.addEventListener('change',e=>{
const file=e.target.files[0];
const reader=new FileReader();

reader.onload=async evt=>{
const wb=XLSX.read(evt.target.result,{type:'binary'});
const rows=XLSX.utils.sheet_to_json(
wb.Sheets[wb.SheetNames[0]],{header:1}
);

for(const r of rows.slice(1)){
if(!r[0]||!r[1])continue;

const id=`${r[0]}_${r[1]}`;

await setDoc(doc(db,COL,id),{
id,
dong:String(r[0]),
ho:String(r[1]),
owner:String(r[2]||""),
ownerPhone:String(r[3]||""),
tenant:String(r[4]||""),
tenantPhone:String(r[5]||"")
});
}

alert("엑셀 완료");
load();
};

reader.readAsBinaryString(file);
});

/* 🔍 검색 (동-호 지원) */
search.oninput=e=>{
const k=e.target.value.toLowerCase();

if(!k) return render();

render(data.filter(v=>
v.owner?.toLowerCase().includes(k)||
v.ownerPhone?.includes(k)||
v.tenant?.toLowerCase().includes(k)||
v.tenantPhone?.includes(k)||
v.ho.includes(k)||
`${v.dong}-${v.ho}`.includes(k)
));
};

load();
</script>

</body>
</html>
