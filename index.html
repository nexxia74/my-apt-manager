<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APT Manager Mobile</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.unit{transition:.2s}
.empty{opacity:.4}
.active{outline:3px solid #3b82f6}

/* 하단 패널 */
.sheet{
position:fixed;
bottom:-100%;
left:0;
width:100%;
background:white;
border-radius:20px 20px 0 0;
box-shadow:0 -10px 30px rgba(0,0,0,.2);
transition:.3s;
}
.sheet.show{bottom:0}
</style>
</head>

<body class="bg-slate-100">

<!-- 상단 -->
<div class="p-3 bg-white shadow flex gap-2">
<input id="search" placeholder="검색" class="flex-1 border p-2 rounded">

<select id="floorFilter" class="border p-2 rounded">
<option value="">층</option>
</select>
</div>

<!-- 버튼 -->
<div class="p-2 grid grid-cols-3 gap-2">
<button id="addDong" class="bg-blue-500 text-white p-2 rounded">동 추가</button>
<button id="addHo" class="bg-green-500 text-white p-2 rounded">호 추가</button>
<button id="deleteDong" class="bg-red-500 text-white p-2 rounded">동 삭제</button>
</div>

<!-- 동 필터 -->
<div id="dongList" class="flex overflow-x-auto gap-2 p-2"></div>

<!-- 그리드 -->
<div id="grid" class="p-2 grid grid-cols-2 gap-2"></div>

<!-- 하단 패널 -->
<div id="sheet" class="sheet p-4">
<h2 id="title" class="font-bold mb-3 text-lg"></h2>

<input id="owner" placeholder="소유주" class="w-full border p-3 mb-2 rounded">
<input id="phone" placeholder="연락처" class="w-full border p-3 mb-2 rounded">
<textarea id="tenant" placeholder="세입자" class="w-full border p-3 mb-3 rounded"></textarea>

<button id="del" class="w-full bg-red-500 text-white p-3 rounded">삭제</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyDM-aCjwJonv6mjAjwdKnyjq3tpBN_ejNQ",
authDomain:"apt-member-id.firebaseapp.com",
projectId:"apt-member-id"
});

const db=getFirestore(app);
const COL="complexes/기본단지/hos";

let data=[],selected=null,timer,selectedDong=null;

// 로드
async function load(){
const snap=await getDocs(collection(db,COL));
data=snap.docs.map(d=>d.data());
render();
renderDong();
renderFloor();
}

// 동 버튼
function renderDong(){
const dongs=[...new Set(data.map(v=>v.dong))];
dongList.innerHTML=dongs.map(d=>
`<button class="px-3 py-1 border rounded ${selectedDong===d?'bg-blue-500 text-white':''}" data-d="${d}">${d}</button>`
).join('');

dongList.querySelectorAll('button').forEach(b=>{
b.onclick=()=>{selectedDong=b.dataset.d;render();}
});
}

// 층
function renderFloor(){
const f=[...new Set(data.map(v=>v.ho.slice(0,-2)))];
floorFilter.innerHTML='<option value="">층</option>'+f.map(x=>`<option>${x}</option>`).join('');
}

// 그리드
function render(list=data){
let l=list;
if(selectedDong) l=l.filter(v=>v.dong===selectedDong);
if(floorFilter.value) l=l.filter(v=>v.ho.startsWith(floorFilter.value));

grid.innerHTML=l.map(v=>{
const empty=!v.owner&&!v.tenant;
return `
<div class="unit p-3 border rounded bg-white ${empty?'empty':''}" data-id="${v.id}">
<div class="font-bold">${v.ho}</div>
<div class="text-xs">${v.owner||'-'}</div>
</div>`;
}).join('');

grid.querySelectorAll('.unit').forEach(c=>{
c.onclick=()=>open(c.dataset.id);
});
}

// 패널 열기
function open(id){
selected=data.find(v=>v.id===id);
sheet.classList.add('show');

title.innerText=`${selected.dong}동 ${selected.ho}`;
owner.value=selected.owner||'';
phone.value=selected.phone||'';
tenant.value=selected.tenant||'';
}

// 자동 저장
function autoSave(){
clearTimeout(timer);
timer=setTimeout(async()=>{
if(!selected)return;

await setDoc(doc(db,COL,selected.id),{
...selected,
owner:owner.value,
phone:phone.value,
tenant:tenant.value
});
load();
},500);
}

owner.oninput=autoSave;
phone.oninput=autoSave;
tenant.oninput=autoSave;

// 삭제
del.onclick=async()=>{
if(!confirm("삭제?"))return;
await deleteDoc(doc(db,COL,selected.id));
sheet.classList.remove('show');
load();
};

// 동 생성
addDong.onclick=async()=>{
const d=prompt("동");
const f=prompt("층수 1~10");
const p=prompt("층당 세대");

const [s,e]=f.split('~').map(Number);

for(let i=s;i<=e;i++){
for(let h=1;h<=p;h++){
const ho=`${i}${String(h).padStart(2,'0')}`;
const id=`${d}_${ho}`;
await setDoc(doc(db,COL,id),{id,dong:d,ho,owner:"",phone:"",tenant:""});
}}
load();
};

// 호 추가
addHo.onclick=async()=>{
const d=prompt("동");
const h=prompt("호");
const id=`${d}_${h}`;
await setDoc(doc(db,COL,id),{id,dong:d,ho:h,owner:"",phone:"",tenant:""});
load();
};

// 동 삭제
deleteDong.onclick=async()=>{
const d=prompt("동 삭제");
const list=data.filter(v=>v.dong===d);
for(const v of list){
await deleteDoc(doc(db,COL,v.id));
}
load();
};

// 검색
search.oninput=e=>{
const k=e.target.value.toLowerCase();
if(!k)return render();

render(data.filter(v=>
v.owner?.toLowerCase().includes(k)||
v.phone?.includes(k)||
v.ho.includes(k)
));
};

floorFilter.onchange=render;

load();
</script>

</body>
</html>
